services:
  api:
    build: ./backend
    ports: ["8000:8000"]
    environment: &env
      INTAKE_DATABASE_URL: postgresql+psycopg://intake:intake@db:5432/intake
      INTAKE_REDIS_URL: redis://redis:6379/0
      INTAKE_LOCAL_STORAGE_DIR: /data/files
    volumes: [filedata:/data/files]
    depends_on: [db, redis]

  worker:
    build: ./backend
    command: celery -A app.worker worker --loglevel=info --concurrency=2
    environment: *env
    volumes: [filedata:/data/files]
    depends_on: [db, redis]

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: intake
      POSTGRES_PASSWORD: intake
      POSTGRES_DB: intake
    volumes: [pgdata:/var/lib/postgresql/data]

  redis:
    image: redis:7-alpine

volumes:
  pgdata:
  filedata:
